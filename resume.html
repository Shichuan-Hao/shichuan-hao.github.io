<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>郝世川 - 个人简历</title>
  <link rel="stylesheet" href="/assets/lib/font-awesome/css/all.min.css">
  <script src="/assets/lib/marked/marked.min.js"></script>
  <script src="/assets/js/html2pdf.bundle.min.js"></script>
  <style>
    :root {
      --card-bg: #ffffff;
      --bg: #f0f2f5;
      --text: #2d3436;
      --text-secondary: #636e72;
      --border: #e8ecf1;

      /* Category accent colors */
      --accent-overview: #667eea;
      --accent-skills: #f093fb;
      --accent-work: #4facfe;
      --accent-project: #43e97b;
      --accent-edu: #fa709a;
      --accent-cert: #f5af19;

      --shadow-sm: 0 1px 3px rgba(0,0,0,0.04), 0 1px 2px rgba(0,0,0,0.03);
      --shadow-md: 0 4px 16px rgba(0,0,0,0.05), 0 2px 6px rgba(0,0,0,0.03);
      --shadow-lg: 0 8px 32px rgba(0,0,0,0.07), 0 3px 10px rgba(0,0,0,0.04);
      --radius: 14px;
      --radius-sm: 10px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #e8ecf1;
      color: var(--text);
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
      background-image:
        radial-gradient(ellipse at 20% 0%, #e0e7ff 0%, transparent 50%),
        radial-gradient(ellipse at 80% 100%, #fce7f3 0%, transparent 50%);
    }

    .container {
      max-width: 900px;
      margin: 48px auto 60px;
    }

    /* ===== Top Card: Profile Header ===== */
    .card-header {
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow-md);
      padding: 44px 52px;
      display: flex;
      align-items: center;
      gap: 32px;
      position: relative;
      overflow: hidden;
      margin-bottom: 28px;
    }
    .card-header::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 5px;
      background: linear-gradient(90deg, #667eea, #764ba2, #f093fb, #4facfe, #43e97b);
    }
    .header-avatar {
      width: 100px; height: 100px;
      border-radius: 24px;
      object-fit: cover; flex-shrink: 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      box-shadow: 0 8px 24px rgba(102,126,234,0.25);
    }
    .header-info h1 {
      font-size: 2rem; font-weight: 800;
      color: #1a1a2e;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }
    .header-info .title {
      font-size: 0.95rem;
      color: var(--text-secondary);
      font-weight: 500;
      margin-bottom: 14px;
      display: flex; align-items: center; gap: 8px;
    }
    .header-info .title .badge {
      display: inline-block;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
      font-size: 0.72rem;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 20px;
      letter-spacing: 0.5px;
    }
    .header-contact {
      display: flex; flex-wrap: wrap; gap: 20px;
      font-size: 0.88rem;
    }
    .header-contact .contact-item {
      display: inline-flex; align-items: center; gap: 7px;
      color: var(--text-secondary);
      text-decoration: none;
      background: #f8fafc;
      padding: 6px 14px;
      border-radius: 8px;
      transition: all 0.2s;
      font-size: 0.84rem;
    }
    .header-contact .contact-item:hover {
      background: #eef2ff;
      color: #667eea;
      transform: translateY(-1px);
    }
    .header-contact .contact-item i {
      color: #667eea;
      font-size: 0.85rem;
    }

    /* Tool button group */
    .tool-group {
      position: absolute;
      top: 20px; right: 24px;
      z-index: 10;
      display: flex;
      flex-direction: row;
      gap: 8px;
    }
    .tool-btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 7px;
      background: #fff;
      color: #667eea;
      border: 1.5px solid #e0e7ff;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s, opacity 0.35s ease, transform 0.35s ease, visibility 0s 0.35s;
      text-decoration: none;
      box-shadow: var(--shadow-sm);
      font-family: inherit;
    }
    .tool-btn:hover:not(.loading) {
      background: #667eea;
      color: #fff;
      border-color: #667eea;
      box-shadow: 0 4px 14px rgba(102,126,234,0.35);
      transform: translateY(-1px);
    }
    .tool-btn.loading {
      cursor: wait;
      opacity: 0 !important;
      visibility: hidden;
    }

    /* 头像淡出过渡 */
    .header-avatar {
      transition: opacity 0.35s ease, transform 0.35s ease, visibility 0s 0.35s;
    }

    /* ===== Content Cards ===== */
    .body {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .section-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      padding: 32px 40px;
      transition: box-shadow 0.3s;
      position: relative;
    }
    .section-card:hover {
      box-shadow: var(--shadow-md);
    }

    /* Section card category strip */
    .section-card[data-section="个人概述"] { border-left: 4px solid var(--accent-overview); }
    .section-card[data-section="技术栈"]   { border-left: 4px solid var(--accent-skills); }
    .section-card[data-section="工作经历"] { border-left: 4px solid var(--accent-work); }
    .section-card[data-section="项目经历"] { border-left: 4px solid var(--accent-project); }
    .section-card[data-section="教育背景"] { border-left: 4px solid var(--accent-edu); }
    .section-card[data-section="证书与资质"] { border-left: 4px solid var(--accent-cert); }

    /* Section titles */
    .body h2 {
      font-size: 1.1rem; font-weight: 700;
      color: #1a1a2e;
      margin-bottom: 18px;
      display: flex; align-items: center; gap: 10px;
      letter-spacing: 0.3px;
    }
    .body h2 i {
      width: 32px; height: 32px;
      display: inline-flex; align-items: center; justify-content: center;
      border-radius: 10px;
      font-size: 0.9rem;
      color: #fff;
    }
    /* Icon backgrounds per section */
    .section-card[data-section="个人概述"] h2 i { background: var(--accent-overview); }
    .section-card[data-section="技术栈"] h2 i   { background: var(--accent-skills); }
    .section-card[data-section="工作经历"] h2 i { background: var(--accent-work); }
    .section-card[data-section="项目经历"] h2 i { background: var(--accent-project); }
    .section-card[data-section="教育背景"] h2 i { background: var(--accent-edu); }
    .section-card[data-section="证书与资质"] h2 i { background: var(--accent-cert); }

    /* Sub-headings */
    .body h3 {
      font-size: 0.82rem; font-weight: 700;
      color: #4a5568;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin: 20px 0 12px 0;
      padding-bottom: 6px;
      border-bottom: 2px solid #f1f5f9;
      display: flex; align-items: center; gap: 8px;
    }
    .body h3::before {
      content: '';
      display: inline-block;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #a0aec0;
    }

    /* Paragraphs */
    .body p {
      color: var(--text-secondary);
      font-size: 0.93rem; line-height: 1.85;
      margin-bottom: 6px;
    }

    /* Skill tags */
    .body p:has(code) {
      display: flex; flex-wrap: wrap; gap: 8px;
      margin: 8px 0 16px 0;
    }
    .body p code {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 0.8rem; font-weight: 600;
      white-space: nowrap;
      letter-spacing: 0.2px;
      transition: transform 0.2s;
      cursor: default;
    }
    .body p code:hover {
      transform: translateY(-2px);
    }
    /* Colorful skill tags */
    .body p code:nth-child(6n+1) { background: #eef2ff; color: #4f46e5; }
    .body p code:nth-child(6n+2) { background: #fce7f3; color: #db2777; }
    .body p code:nth-child(6n+3) { background: #e0f2fe; color: #0284c7; }
    .body p code:nth-child(6n+4) { background: #d1fae5; color: #059669; }
    .body p code:nth-child(6n+5) { background: #fef3c7; color: #d97706; }
    .body p code:nth-child(6n+6) { background: #ede9fe; color: #7c3aed; }

    /* Lists */
    .body ul { list-style: none; padding: 0; margin: 0; }
    .body li {
      position: relative;
      padding: 8px 0 8px 22px;
      font-size: 0.9rem;
      color: var(--text-secondary);
      line-height: 1.7;
    }
    .body li::before {
      content: '';
      position: absolute;
      left: 0; top: 15px;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #cbd5e1;
    }
    .body li strong {
      color: #1a1a2e;
      font-weight: 600;
    }

    /* Blockquotes → placeholder card */
    .body blockquote {
      background: linear-gradient(135deg, #fffbeb 0%, #fefce8 100%);
      border: 1px solid #fde68a;
      border-left: 4px solid #f59e0b;
      border-radius: 0 10px 10px 0;
      padding: 18px 22px; margin: 12px 0;
      font-size: 0.87rem; color: #92400e;
      position: relative;
    }
    .body blockquote::before {
      content: '\f044';
      font-family: 'Font Awesome 6 Free';
      font-weight: 900;
      position: absolute;
      right: 18px; top: 16px;
      color: #fbbf24;
      font-size: 1.2rem;
      opacity: 0.6;
    }

    /* ===== 响应式 ===== */
    @media (max-width: 768px) {
      .container { margin: 0; }
      .card-header {
        border-radius: 0; flex-direction: column; text-align: center;
        padding: 32px 24px; gap: 18px;
      }
      .header-contact { justify-content: center; }
      .section-card { border-radius: 0; padding: 24px 20px; }
      .body { gap: 12px; }
      .tool-group { top: 12px; right: 12px; gap: 6px; }
      .tool-btn { padding: 6px 12px; font-size: 0.78rem; }
    }

    /* ===== 打印 ===== */
    @media print {
      .tool-group { display: none; }
      body {
        background: #fff;
        font-size: 12px;
      }
      .container { max-width: 100%; margin: 0; }
      .card-header {
        border-radius: 0; box-shadow: none;
        padding: 24px 32px 20px;
      }
      .card-header::before { display: none; }
      .header-avatar { box-shadow: none; width: 70px; height: 70px; }
      .section-card {
        border-radius: 0; box-shadow: none;
        padding: 18px 32px;
        border-left-width: 3px !important;
        page-break-inside: avoid;
      }
      .section-card:hover { box-shadow: none; }
      .body { gap: 0; }
      .body p code:hover { transform: none; }
      @page { margin: 0; }
    }
  </style>
</head>

  <!-- ===== Markdown Content ===== -->
  <script type="text/markdown" id="md-source">

  <script>
    // 渲染 Markdown 并注入图标
    const md = document.getElementById('md-source').textContent;
    const html = marked.parse(md);
    const content = document.getElementById('content');

    // 图标映射
    const iconMap = {
      '个人概述': 'fa-user',
      '技术栈': 'fa-code',
      '工作经历': 'fa-briefcase',
      '项目经历': 'fa-diagram-project',
      '教育背景': 'fa-graduation-cap',
      '证书与资质': 'fa-certificate',
    };

    let result = html;
    for (const [title, icon] of Object.entries(iconMap)) {
      result = result.replace(
        new RegExp(`(<h2[^>]*>)(${title})`, 'g'),
        `$1<i class="fas ${icon}"></i> $2`
      );
    }

    // 将每个 section 包裹为 card
    // 使用 h2 作为分隔，把内容分组
    const temp = document.createElement('div');
    temp.innerHTML = result;

    // 收集 h2 元素，把 h2 之间的内容分组
    const sections = [];
    let currentSection = null;
    for (const node of temp.childNodes) {
      if (node.nodeName === 'H2') {
        if (currentSection) sections.push(currentSection);
        currentSection = { heading: node, body: [] };
      } else if (currentSection) {
        currentSection.body.push(node);
      }
    }
    if (currentSection) sections.push(currentSection);

    // 构建卡片
    content.innerHTML = '';
    for (const sec of sections) {
      const card = document.createElement('div');
      card.className = 'section-card';

      // 提取标题文本用于 data-section
      const titleText = sec.heading.textContent.trim();
      card.setAttribute('data-section', titleText);

      card.appendChild(sec.heading.cloneNode(true));
      for (const node of sec.body) {
        card.appendChild(node.cloneNode(true));
      }
      content.appendChild(card);
    }

    // PDF 下载
    document.getElementById('btnDownload').addEventListener('click', function () {
      const btn = this;
      const avatar = document.querySelector('.header-avatar');
      const toolGroup = document.getElementById('toolGroup');

      if (btn.classList.contains('loading')) return;

      btn.classList.add('loading');
      avatar.style.opacity = '0';
      avatar.style.transform = 'scale(0.9)';
      avatar.style.visibility = 'hidden';

      const element = document.querySelector('.container');
      const opt = {
        margin: [0, 0, 0, 0],
        filename: '郝世川-个人简历.pdf',
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: {
          scale: 2,
          useCORS: true,
          letterRendering: true,
          backgroundColor: '#ffffff'
        },
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
        pagebreak: { mode: ['avoid-all', 'css', 'legacy'] }
      };

      html2pdf().set(opt).from(element).save().then(function () {
        btn.classList.remove('loading');
        avatar.style.opacity = '';
        avatar.style.transform = '';
        avatar.style.visibility = '';
      });
    });

    // 打印
    document.getElementById('btnPrint').addEventListener('click', function () {
      const avatar = document.querySelector('.header-avatar');
      const toolGroup = document.getElementById('toolGroup');

      toolGroup.style.display = 'none';
      if (avatar) avatar.style.opacity = '0';

      window.print();

      // 打印对话框关闭后恢复
      setTimeout(() => {
        toolGroup.style.display = '';
        if (avatar) avatar.style.opacity = '';
      }, 100);
    });
  </script>
