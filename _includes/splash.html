<script type="text/template" id="splash-tpl">

  <style>
    /* ===== 精装书封 · 米白调 ===== */
    :root {
      --book-bg: #ffffff;
      --book-bg2: #fcfaf5;
      --book-spine: #c49a3c;
      --book-spine2: #8b6914;
      --book-text: #3d2b1f;
      --book-gold: #b8860b;
      --book-gold-light: #d4af37;
    }

    .splash-overlay {
      position:fixed;inset:0;z-index:99999;
      background:#e8ecf1;
      background-image:
        radial-gradient(ellipse at 20% 0%, #e0e7ff 0%, transparent 50%),
        radial-gradient(ellipse at 80% 100%, #fce7f3 0%, transparent 50%);
      display:flex;align-items:center;justify-content:center;
      cursor:pointer;-webkit-tap-highlight-color:transparent;
      transition:transform .8s cubic-bezier(.4,0,.2,1),opacity .8s ease;
      overflow:hidden;
      perspective:1000px;
    }
    .splash-overlay:not(.dismiss) ~ * { display:none; }
    html:has(.splash-overlay:not(.dismiss)) { overflow:hidden; }
      transform:translateY(-100%);opacity:0;pointer-events:none;
    }

    /* ---- 浮动金粉粒子 ---- */
    .splash-particles {
      position:absolute;inset:0;pointer-events:none;z-index:0;
    }
    .splash-particle {
      position:absolute;border-radius:50%;
      background:radial-gradient(circle, var(--book-gold-light), transparent);
      animation:particleFloat linear infinite;
    }
    @keyframes particleFloat {
      0%   {transform:translateY(0) translateX(0);opacity:0;}
      10%  {opacity:.6;}
      90%  {opacity:.2;}
      100% {transform:translateY(-100vh) translateX(20px);opacity:0;}
    }

    /* ===== 书本卡片 ===== */
    .splash-book {
      position:relative;z-index:1;
      width:min(480px,88vw);
      min-height:420px;
      padding:60px 44px 50px;
      background:linear-gradient(165deg, var(--book-bg) 0%, var(--book-bg2) 100%);
      border-radius:6px 16px 16px 6px;
      box-shadow:
        0 8px 30px rgba(100,70,30,.08),
        0 20px 60px rgba(120,90,40,.15),
        0 2px 8px rgba(80,50,20,.06);
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      text-align:center;
      transform:rotateY(-2deg);
      animation:bookReveal 1s cubic-bezier(.22,.61,.36,1);
      transition:transform .5s ease,box-shadow .5s ease;
      transform-style:preserve-3d;
    }
    .splash-overlay:hover .splash-book {
      transform:rotateY(0deg) rotateX(2deg);
      box-shadow:
        0 12px 36px rgba(100,70,30,.12),
        0 24px 64px rgba(120,90,40,.2),
        0 2px 8px rgba(80,50,20,.08);
    }

    /* ---- 右侧页面叠层 ---- */
    .splash-book::after {
      content:'';
      position:absolute;right:-8px;top:6px;bottom:6px;
      width:8px;
      background:linear-gradient(90deg, rgba(180,160,130,.25), rgba(180,160,130,.1));
      border-radius:0 4px 4px 0;
      box-shadow:
        10px 0 0 rgba(180,160,130,.12),
        18px 0 0 rgba(180,160,130,.05);
    }

    /* ---- 书脊 ---- */
    .splash-spine {
      position:absolute;left:-14px;top:0;bottom:0;
      width:14px;
      background:linear-gradient(90deg, var(--book-spine2), var(--book-spine), var(--book-spine2));
      border-radius:3px 0 0 3px;
      box-shadow:inset -2px 0 4px rgba(0,0,0,.15);
    }
    .splash-spine::after {
      content:'';
      position:absolute;left:2px;right:2px;top:8px;
      height:18px;background:rgba(0,0,0,.3);border-radius:1px;
    }

    /* ---- 金色书签 ---- */
    .splash-bookmark {
      position:absolute;top:-16px;right:40px;
      width:10px;height:58px;z-index:10;
      background:linear-gradient(180deg, #d4a853, #b8860b, #8b6914);
      border-radius:2px 2px 0 0;
      box-shadow:0 2px 10px rgba(139,105,20,.35);
      animation:bookmarkDrop .7s .2s cubic-bezier(.34,1.56,.64,1) both;
    }
    .splash-bookmark::after {
      content:'';
      position:absolute;bottom:0;left:-3px;
      width:0;height:0;
      border-left:8px solid transparent;
      border-right:8px solid transparent;
      border-top:8px solid #8b6914;
    }

    /* ---- 头像 ---- */
    .splash-avatar {
      width:76px;height:76px;margin-bottom:32px;border-radius:50%;overflow:hidden;
      border:2px solid rgba(180,160,120,.3);
      box-shadow:0 4px 20px rgba(120,90,40,.08);
      animation:avatarFade 1s .3s both;
      z-index:2;
    }
    .splash-avatar img {
      width:100%;height:100%;object-fit:cover;
    }

    /* ---- 装饰线 + 菱形 ---- */
    .splash-rule-top {
      display:flex;align-items:center;justify-content:center;
      width:70%;margin-bottom:18px;
      animation:titleFade .9s .5s both;
    }
    .splash-rule-bottom {
      display:flex;align-items:center;justify-content:center;
      width:70%;margin-top:20px;
      animation:titleFade .9s .5s both;
    }
    .splash-line {
      flex:1;height:1px;
      background:linear-gradient(90deg, transparent, rgba(180,140,80,.4), transparent);
    }
    .splash-diamond {
      width:8px;height:8px;margin:0 14px;
      background:var(--book-gold);
      transform:rotate(45deg);
      box-shadow:0 0 6px rgba(184,134,11,.3);
    }

    /* ---- 标题 ---- */
    .splash-title {
      font-size:2.6rem;font-weight:900;letter-spacing:10px;margin:0;
      background:linear-gradient(180deg, #f5e6c8 0%, #c49a3c 50%, #8b6914 100%);
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;
      background-clip:text;
      font-family:Georgia,"Noto Serif SC","Source Han Serif SC",serif;
      animation:titleFade .9s .5s both;
      text-shadow:none;
      filter:drop-shadow(0 2px 4px rgba(139,105,20,.15));
    }
    .splash-subtitle {
      font-size:.92rem;color:#8b7355;font-weight:400;
      letter-spacing:4px;margin:4px 0 0;
      font-family:Georgia,"Noto Serif SC",serif;
      animation:titleFade .9s .65s both;
    }

    /* ---- 提示 ---- */
    .splash-hint {
      margin-top:28px;
      display:flex;flex-direction:column;align-items:center;gap:10px;
      color:rgba(140,110,70,.3);font-size:.78rem;letter-spacing:3px;
      animation:titleFade .9s .9s both;
    }
    .splash-arrow {
      display:inline-block;width:14px;height:14px;
      border-right:1.5px solid rgba(160,120,60,.35);
      border-bottom:1.5px solid rgba(160,120,60,.35);
      transform:rotate(45deg);
      animation:bookArrow 2s ease infinite;
    }

    /* ===== 动画关键帧 ===== */
    @keyframes bookReveal {
      from {opacity:0;transform:rotateY(-2deg) scale(.88) translateY(30px);}
      to   {opacity:1;transform:rotateY(-2deg) scale(1) translateY(0);}
    }
    @keyframes bookmarkDrop {
      from {transform:translateY(-60px);opacity:0;}
      to   {transform:translateY(0);opacity:1;}
    }
    @keyframes avatarFade {
      from {opacity:0;transform:scale(.8);}
      to   {opacity:1;transform:scale(1);}
    }
    @keyframes titleFade {
      from {opacity:0;transform:translateY(12px);}
      to   {opacity:1;transform:translateY(0);}
    }
    @keyframes bookArrow {
      0%,100% {transform:rotate(45deg) translateY(0);opacity:.25;}
      50%    {transform:rotate(45deg) translateY(5px);opacity:.6;}
    }

    /* ---- 响应式 ---- */
    @media (max-width:600px) {
      .splash-book {padding:44px 28px 36px;min-height:340px;}
      .splash-title {font-size:1.9rem;letter-spacing:6px;}
      .splash-subtitle {font-size:.8rem;letter-spacing:2px;}
      .splash-avatar {width:60px;height:60px;margin-bottom:24px;}
      .splash-bookmark {width:8px;height:44px;top:-12px;right:28px;}
      .splash-bookmark::after {border-left-width:6px;border-right-width:6px;border-top-width:6px;}
      .splash-spine {width:10px;left:-10px;}
    }

    #main-wrapper {visibility:hidden}
    .splash-overlay.dismiss + #main-wrapper {visibility:visible}
  </style>

  <div id="splash" class="splash-overlay">

    <!-- 浮动金粉粒子 -->
    <div class="splash-particles" id="splashParticles"></div>

    <!-- 书本 -->
    <div class="splash-book">
      <!-- 书脊 -->
      <div class="splash-spine"></div>

      <!-- 金色书签 -->
      <div class="splash-bookmark"></div>

      <!-- 头像 -->
      <div class="splash-avatar">
        <img src="{{ '/assets/img/avatar/avatar.png' | relative_url }}" alt="avatar" onerror="this.style.display='none'">
      </div>

      <!-- 装饰线 + 菱形（上） -->
      <div class="splash-rule-top">
        <span class="splash-line"></span>
        <span class="splash-diamond"></span>
        <span class="splash-line"></span>
      </div>

      <!-- 标题 -->
      <h1 class="splash-title">字节漫步</h1>
      <p class="splash-subtitle">探索技术的无限可能</p>

      <!-- 装饰线 + 菱形（下） -->
      <div class="splash-rule-bottom">
        <span class="splash-line"></span>
        <span class="splash-diamond"></span>
        <span class="splash-line"></span>
      </div>

      <!-- 进入提示 -->
      <div class="splash-hint">
        <span>点 击 或 上 滑 进 入</span>
        <i class="splash-arrow"></i>
      </div>
    </div>

  </div>

  <script>
    /* 浮动金粉粒子 */
    (function(){
      var container=document.getElementById('splashParticles');
      if(!container)return;
      var count=50,colors=['#d4af37','#c49a3c','#b8860b','#daa520','#e6c84c'];
      for(var i=0;i<count;i++){
        var p=document.createElement('div');
        p.className='splash-particle';
        p.style.left=Math.random()*100+'%';
        p.style.top=(60+Math.random()*40)+'%';
        p.style.width=(2+Math.random()*4)+'px';
        p.style.height=p.style.width;
        p.style.animationDuration=(8+Math.random()*14)+'s';
        p.style.animationDelay=(Math.random()*10)+'s';
        p.style.background='radial-gradient(circle, '+colors[Math.floor(Math.random()*colors.length)]+', transparent)';
        container.appendChild(p);
      }
    })();
  </script>

</script>
